<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON STRIKE: VOID RUNNER</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #06060c;
    color: #00f3ff;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 1280px;
    max-height: 720px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #06060c;
    box-shadow: 0 0 50px rgba(0, 243, 255, 0.15), 0 0 100px rgba(176, 38, 255, 0.1);
    border: 1px solid rgba(0, 243, 255, 0.3);
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
<script type="module" src="src/main.js"></script>
</head>
<body>
<div id="wrapper">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="status" role="status" aria-live="polite"></div>
</div>
</body>
</html>
